services:
  alumni-mongodb:
    image: mongo
    container_name: alumni-mongodb
    volumes:
      - alumni_mongodb_data:/data/db
    ports:
      - "27018:27017"

  alumni-app:
    build: .
    container_name: alumni-app
    command: npx ts-node api/server.ts
    environment:
      - DATABASE_HOST=alumni-mongodb
      - NODE_ENV=development
    ports:
      - "8081:8081"
    depends_on:
      - alumni-mongodb
    volumes:
      - ./api:/app/api

  alumni-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alumni-frontend
    ports:
      - "5173:5173"
    depends_on:
      - alumni-app
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html

volumes:
  alumni_mongodb_data:
